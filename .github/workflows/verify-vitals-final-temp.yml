name: Temporary verify Core Web Vitals finalization
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Trigger LCP INP CLS on visibility hidden
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844}});
          await context.addInitScript(()=>localStorage.setItem('analytics-consent','yes'));
          const events=[];
          context.on('response',r=>{if(r.url().includes('/api/web-vitals'))events.push({status:r.status(),url:r.url()})});
          const page=await context.newPage();
          const errs=[];page.on('pageerror',e=>errs.push(e.message));
          const res=await page.goto('https://mopc.store/ar',{waitUntil:'networkidle',timeout:50000});
          await page.waitForTimeout(1500);
          // Real user interaction without modifying orders, accounts, or money.
          await page.locator('.cyan-hero-primary').click();
          await page.waitForTimeout(800);
          const other=await context.newPage();
          await other.goto('https://mopc.store/ar/catalog',{waitUntil:'domcontentloaded',timeout:50000});
          await other.bringToFront();
          await page.waitForTimeout(2300);
          console.log('FINALIZED-VITALS',JSON.stringify({status:res.status(),events,errors:errs,hidden:await page.evaluate(()=>document.visibilityState)}));
          if(res.status()!==200||errs.length||!events.some(x=>x.status===204))process.exitCode=1;
          await context.close();await browser.close();
          NODE
