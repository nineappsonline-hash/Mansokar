name: Temporary verify consented Web Vitals on Production
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify consent, collection, strict validation and storefront
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser=await chromium.launch({headless:true});
          try {
            for (const locale of ['ar','en']) {
              const context=await browser.newContext({viewport:{width:390,height:844},locale:locale==='ar'?'ar-EG':'en-US'});
              await context.addInitScript(()=>localStorage.setItem('analytics-consent','yes'));
              const page=await context.newPage();
              const requests=[],errors=[];
              page.on('response',r=>{
                if(r.url().includes('/api/web-vitals'))requests.push({status:r.status(),method:r.request().method(),body:r.request().postData()});
              });
              page.on('pageerror',e=>errors.push(e.message));
              const res=await page.goto('https://mopc.store/'+locale,{waitUntil:'networkidle',timeout:50000});
              await page.waitForTimeout(1500);
              console.log('VITALS-ALLOW',JSON.stringify({locale,status:res.status(),vitals:requests.map(x=>({status:x.status,method:x.method,body:x.body})),errors}));
              if(res.status()!==200||errors.length||!requests.some(x=>x.status===204&&x.method==='POST'))process.exitCode=1;
              await context.close();
            }
            const context=await browser.newContext({viewport:{width:390,height:844}});
            await context.addInitScript(()=>localStorage.setItem('analytics-consent','no'));
            const page=await context.newPage();
            let posted=0;
            page.on('request',r=>{if(r.url().includes('/api/web-vitals'))posted++});
            const res=await page.goto('https://mopc.store/ar',{waitUntil:'networkidle',timeout:50000});
            await page.waitForTimeout(1200);
            const forbidden=await page.evaluate(async()=>{
              const r=await fetch('/api/web-vitals',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:'LCP',value:900,rating:'good',page:'home',device:'mobile',locale:'ar',email:'secret@example.com'})});
              return r.status;
            });
            console.log('VITALS-DENY',JSON.stringify({status:res.status(),telemetryRequests:posted,invalidRejected:forbidden}));
            // The direct invalid POST above counts as one attempted request; no valid automatic telemetry allowed.
            if(res.status()!==200||posted!==1||forbidden!==400)process.exitCode=1;
            await context.close();
          }finally{await browser.close()}
          NODE
