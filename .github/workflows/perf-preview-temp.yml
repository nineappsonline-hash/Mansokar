name: Temporary MOPC preview performance audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [perf/optimize-heavy-images-cache-20261127]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Measure current image-optimized preview
        env:
          PERF_BASE_URL: https://mansokar-47kjucb3t-9apps.vercel.app
          PERF_LOCALE: ar
        run: npm run perf:routes
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mopc-preview-optimized
          path: reports/browser-network.json
          if-no-files-found: ignore
