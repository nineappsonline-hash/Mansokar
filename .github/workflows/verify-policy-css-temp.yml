name: Temporary verify policy CSS and production performance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Audit public routes
        env:
          PERF_BASE_URL: https://mopc.store
          PERF_LOCALE: ar
        run: npm run perf:routes
      - name: Verify policy-only CSS delivery (read-only)
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser=await chromium.launch({headless:true});
          for(const route of ['/ar','/ar/catalog','/ar/products/coolant-overflow-tank-gm-p-c4c0ce8c-7060-4591-9e4e-64650dfc7f15','/ar/policies/shipping','/ar/policies/returns','/en/policies/warranty']){
            const context=await browser.newContext({viewport:{width:390,height:844}});
            const page=await context.newPage();
            const network=[];const errors=[];
            page.on('response',res=>{if(res.url().includes('policy-only.css'))network.push({status:res.status(),url:res.url()})});
            page.on('pageerror',e=>errors.push(String(e)));
            const response=await page.goto('https://mopc.store'+route,{waitUntil:'networkidle',timeout:50000});
            const present=await page.locator('link[href*="policy-only.css"]').count()>0;
            const expected=route.includes('/policies/');
            const title=expected?await page.locator('.policy-page').count():0;
            console.log('POLICY-CSS',JSON.stringify({route,status:response.status(),present,network,title,errors}));
            if(response.status()!==200||present!==expected||(expected&&(!title||!network.some(x=>x.status===200)))||errors.length)process.exitCode=1;
            await context.close();
          }
          await browser.close();
          NODE
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mopc-policy-css-audit
          path: reports/browser-network.json
          if-no-files-found: ignore
