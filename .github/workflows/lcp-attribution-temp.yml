name: Temporary LCP root cause audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lcp:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Repeat LCP attribution against live production
        env:
          PERF_BASE_URL: https://mopc.store
        run: node scripts/audit-lcp-attribution.mjs
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcp-attribution-baseline
          path: reports/lcp-attribution.json
          if-no-files-found: ignore
