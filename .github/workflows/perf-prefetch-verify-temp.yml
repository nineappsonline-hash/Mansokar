name: Temporary MOPC prefetched route benchmark
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Benchmark live MOPC homepage and products (read-only)
        env:
          PERF_BASE_URL: https://mopc.store
          PERF_LOCALE: ar
        run: npm run perf:routes
      - name: Upload browser timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mopc-prefetch-verify
          path: reports/browser-network.json
          if-no-files-found: ignore
